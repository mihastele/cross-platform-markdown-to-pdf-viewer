name: CI
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core + CLI
        run: cargo test -p mdpdf-core -p mdpdf
      - name: Build viewer
        run: cargo build --release -p mdview
      - name: Smoke test PDF export
        run: cargo run --release -p mdpdf -- examples/showcase.md -o showcase.pdf
      - name: Smoke test Designed mode
        run: |
          cargo run --release -p mdpdf -- --mode designed examples/designed.md -o designed.pdf
          cargo run --release -p mdpdf -- --mode designed examples/report.html -o report.pdf
